steps:
  - id: test
    name: python:3.13-slim-trixie@sha256:ffb752e139c0a19692a43af8d8523b274222dd68eebad5d583b45c2201c6e30a
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m venv /tmp/venv
        /tmp/venv/bin/python -m pip install --disable-pip-version-check -e '.[dev]'
        /tmp/venv/bin/python -m pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker@sha256:661e95acd923514f71f47ce7b390e06a8d31b15febecf772e506babf62960528
    args: [build, -t, '${_IMAGE}:$BUILD_ID', .]

  - id: push
    name: gcr.io/cloud-builders/docker@sha256:661e95acd923514f71f47ce7b390e06a8d31b15febecf772e506babf62960528
    args: [push, '${_IMAGE}:$BUILD_ID']

  - id: scan
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:144d47fa0304a95021a154107409422af38f302f3fca9fd1038ce487e76ac3ff
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update -qq
        apt-get install -y --no-install-recommends google-cloud-cli-local-extract
        scan_name="$$(gcloud artifacts docker images scan '${_IMAGE}:$BUILD_ID' \
          --project='$PROJECT_ID' --location=us --remote --format='value(response.scan)')"
        gcloud artifacts docker images list-vulnerabilities "$${scan_name}" \
          --project='$PROJECT_ID' --location=us --format=json > /workspace/vulnerabilities.json
        python3 - <<'PY'
        import json
        rows = json.load(open('/workspace/vulnerabilities.json'))
        severe = [row for row in rows if row.get('vulnerability', {}).get('effectiveSeverity') in {'HIGH', 'CRITICAL'}]
        print(json.dumps({'totalFindings': len(rows), 'highCriticalFindings': len(severe)}))
        if severe:
            raise SystemExit('release_blocked_by_high_or_critical_vulnerability')
        PY

  - id: deploy-reporting
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:144d47fa0304a95021a154107409422af38f302f3fca9fd1038ce487e76ac3ff
    entrypoint: gcloud
    args:
      - run
      - deploy
      - measurement-reporting-platform
      - '--project=$PROJECT_ID'
      - --region=us-central1
      - '--image=${_IMAGE}:$BUILD_ID'
      - --startup-probe=httpGet.path=/health,timeoutSeconds=2,periodSeconds=5,failureThreshold=12
      - --readiness-probe=httpGet.path=/healthz,timeoutSeconds=2,periodSeconds=5,failureThreshold=3
      - --liveness-probe=httpGet.path=/health,initialDelaySeconds=10,timeoutSeconds=2,periodSeconds=30,failureThreshold=3
      - --quiet

  - id: deploy-callback
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:144d47fa0304a95021a154107409422af38f302f3fca9fd1038ce487e76ac3ff
    entrypoint: gcloud
    args:
      - run
      - deploy
      - measurement-oauth-callback
      - '--project=$PROJECT_ID'
      - --region=us-central1
      - '--image=${_IMAGE}:$BUILD_ID'
      - --startup-probe=httpGet.path=/health,timeoutSeconds=2,periodSeconds=5,failureThreshold=12
      - --readiness-probe=httpGet.path=/healthz,timeoutSeconds=2,periodSeconds=5,failureThreshold=3
      - --liveness-probe=httpGet.path=/health,initialDelaySeconds=10,timeoutSeconds=2,periodSeconds=30,failureThreshold=3
      - --quiet

  - id: verify-release
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:144d47fa0304a95021a154107409422af38f302f3fca9fd1038ce487e76ac3ff
    entrypoint: bash
    args:
      - -ceu
      - |
        test "$$(gcloud scheduler jobs describe measurement-report-dispatch \
          --project='$PROJECT_ID' --location=us-central1 --format='value(state)')" = PAUSED
        gcloud run services describe measurement-reporting-platform \
          --project='$PROJECT_ID' --region=us-central1 --format=json > /workspace/reporting-service.json
        gcloud run services describe measurement-oauth-callback \
          --project='$PROJECT_ID' --region=us-central1 --format=json > /workspace/callback-service.json
        python3 - <<'PY'
        import json
        from urllib.request import urlopen

        expected_image = '${_IMAGE}:$BUILD_ID'
        for filename, service in [
            ('/workspace/reporting-service.json', 'measurement-reporting-platform'),
            ('/workspace/callback-service.json', 'measurement-oauth-callback'),
        ]:
            value = json.load(open(filename))
            assert any(item.get('percent') == 100 for item in value['status']['traffic'])
            container = value['spec']['template']['spec']['containers'][0]
            assert container['image'] == expected_image
            assert container['startupProbe']['httpGet']['path'] == '/health'
            assert container['readinessProbe']['httpGet']['path'] == '/healthz'
            assert container['livenessProbe']['httpGet']['path'] == '/health'
        callback = json.load(open('/workspace/callback-service.json'))
        annotations = callback['metadata']['annotations']
        assert annotations['run.googleapis.com/minScale'] == '1'
        assert annotations['run.googleapis.com/maxScale'] == '2'
        with urlopen('https://measurement-oauth-callback-ptlwmdunva-uc.a.run.app/healthz', timeout=10) as response:
            payload = json.load(response)
            assert response.status == 200 and payload['status'] == 'ready'
        print(json.dumps({'releaseVerified': True, 'reportDispatch': 'PAUSED'}))
        PY

images:
  - '${_IMAGE}:$BUILD_ID'

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/web-analytics-agency-prod/cloud-run-source-deploy/measurement-reporting-platform

serviceAccount: projects/web-analytics-agency-prod/serviceAccounts/measurement-builder@web-analytics-agency-prod.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
